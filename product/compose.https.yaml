services:
  web:
    ports: !reset []
  business:
    environment:
      PRODUCT_SESSION_SECURE: "true"
  gateway:
    image: nginx:1.28-alpine
    environment:
      PRODUCT_HTTPS_PORT: ${PRODUCT_HTTPS_PORT:-3443}
      NGINX_ENVSUBST_FILTER: "^PRODUCT_HTTPS_PORT$"
    ports:
      - "127.0.0.1:${PRODUCT_HTTP_PORT:-3100}:80"
      - "127.0.0.1:${PRODUCT_HTTPS_PORT:-3443}:443"
    volumes:
      - ./tls/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./tls/local/server.crt:/etc/nginx/tls/server.crt:ro
      - ./tls/local/server.key:/etc/nginx/tls/server.key:ro
    depends_on:
      web: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "wget -S -O /dev/null --no-check-certificate https://127.0.0.1/ 2>&1 | grep -q '200 OK'"]
      interval: 5s
      timeout: 5s
      retries: 20
